<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f5">
<title>日繰り表</title>
<link rel="manifest" href="data:application/json,{}">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --border:#bbb;--header-bg:#e8e8e8;--row-alt:#fafafa;
  --income:#1a6b1a;--expense:#a00;--skipped:#888;
  --split-bg:#f0f4ff;--split-border:#6b8cce;
  --toolbar-bg:#ddd;--btn:#fff;--btn-hover:#eee;
}
html,body{margin:0;padding:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:14px;background:#f5f5f5;color:#222;height:100%}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--toolbar-bg);border-bottom:1px solid var(--border);align-items:center}
.toolbar button,.toolbar select{padding:6px 12px;border:1px solid var(--border);border-radius:4px;background:var(--btn);cursor:pointer;font-size:13px}
.toolbar button:hover{background:var(--btn-hover)}
.toolbar .spacer{flex:1}
.tabs{display:flex;background:#ccc;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;cursor:pointer;border-right:1px solid var(--border);font-size:13px}
.tab.active{background:#f5f5f5;font-weight:bold}
.main{flex:1;overflow:auto;padding:8px}
.panel{display:none}
.panel.active{display:block}
.grid-wrap{overflow:auto;border:1px solid var(--border);background:#fff}
table.grid{border-collapse:collapse;width:100%;min-width:600px;font-size:13px}
table.grid th,table.grid td{border:1px solid var(--border);padding:4px 8px;white-space:nowrap}
table.grid th{background:var(--header-bg);position:sticky;top:0;z-index:2;text-align:center;font-weight:600}
table.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid td.date{text-align:center}
table.grid tr:nth-child(even):not(.split-group){background:var(--row-alt)}
table.grid tr.skipped td{color:var(--skipped);font-style:italic}
table.grid tr.skipped td.amount{text-decoration:line-through}
table.grid tr.split-group td{background:var(--split-bg);border-left:3px solid var(--split-border)}
table.grid tr.split-group-first td{border-top:2px solid var(--split-border)}
table.grid tr.split-group-last td{border-bottom:2px solid var(--split-border)}
table.grid tr.settlement{cursor:pointer}
table.grid tr.settlement:hover{background:#fff8e1}
table.grid tr.selected{background:#d4e8ff!important}
.income{color:var(--income)}.expense{color:var(--expense)}
.split-total{font-size:11px;color:#555;margin-left:8px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:8px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.modal h3{margin:0 0 16px;font-size:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:#555;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;font-size:14px}
.form-row textarea{resize:vertical;min-height:60px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.form-actions button{padding:8px 16px;border:1px solid var(--border);border-radius:4px;cursor:pointer}
.form-actions .primary{background:#2563eb;color:#fff;border-color:#2563eb}
.master-list{margin-bottom:16px}
.master-item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);margin-bottom:4px;background:#fff;border-radius:4px}
.master-item .info{flex:1}
.master-item .name{font-weight:600}
.master-item .detail{font-size:12px;color:#666}
.sync-status{font-size:12px;padding:4px 8px;border-radius:4px}
.sync-status.ok{background:#d4edda;color:#155724}
.sync-status.warn{background:#fff3cd;color:#856404}
.sync-status.err{background:#f8d7da;color:#721c24}
.hidden{display:none!important}
.detail-panel{margin-top:12px;padding:12px;background:#fff;border:1px solid var(--border);border-radius:4px}
.detail-panel h4{margin:0 0 8px;font-size:14px}
.empty-msg{text-align:center;padding:40px;color:#888}
@media(max-width:768px){
  .toolbar button{padding:8px 10px;font-size:12px}
  table.grid{font-size:12px}
  table.grid th,table.grid td{padding:3px 5px}
}
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <div class="tab active" data-tab="ledger">日繰表</div>
    <div class="tab" data-tab="masters">マスタ管理</div>
    <div class="tab" data-tab="settings">設定</div>
  </div>
  <div class="toolbar" id="ledger-toolbar">
    <button id="btn-add-entry">＋ 入出金追加</button>
    <button id="btn-edit-entry" disabled>編集</button>
    <button id="btn-split-entry" disabled>分割</button>
    <button id="btn-card-switch" disabled>カード払い</button>
    <button id="btn-delete-entry" disabled>削除</button>
    <div class="spacer"></div>
    <label>表示期間:</label>
    <input type="month" id="view-start">
    <span>〜</span>
    <input type="month" id="view-end">
    <span id="sync-badge" class="sync-status ok">ローカル</span>
  </div>
  <div class="main">
  <div class="panel active" id="panel-ledger">
    <div class="grid-wrap">
      <table class="grid" id="ledger-table">
        <thead id="ledger-head"></thead>
        <tbody id="ledger-body"></tbody>
      </table>
    </div>
    <div id="detail-panel" class="detail-panel hidden"></div>
  </div>
  <div class="panel" id="panel-masters">
    <h3>口座</h3>
    <div id="accounts-list" class="master-list"></div>
    <button id="btn-add-account">＋ 口座追加</button>
    <h3>カード</h3>
    <div id="cards-list" class="master-list"></div>
    <button id="btn-add-card">＋ カード追加</button>
    <h3>借入金</h3>
    <div id="loans-list" class="master-list"></div>
    <button id="btn-add-loan">＋ 借入金追加</button>
    <h3>固定費</h3>
    <div id="fixedcosts-list" class="master-list"></div>
    <button id="btn-add-fixedcost">＋ 固定費追加</button>
  </div>
  <div class="panel" id="panel-settings">
    <h3>Dropbox同期</h3>
    <p style="font-size:13px;color:#666">データは <code>shikinguri-data.json</code> としてDropboxに保存されます。</p>
    <div class="form-row">
      <label>Dropbox App Key</label>
      <input type="text" id="dropbox-app-key" placeholder="アプリキーを入力">
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button id="btn-dropbox-connect">Dropboxに接続</button>
      <button id="btn-dropbox-sync" disabled>今すぐ同期</button>
      <button id="btn-dropbox-disconnect" disabled>切断</button>
    </div>
    <p id="dropbox-status" style="font-size:13px;color:#666">未接続</p>
    <h3>データ管理</h3>
    <div style="display:flex;gap:8px">
      <button id="btn-export">JSONエクスポート</button>
      <button id="btn-import">JSONインポート</button>
      <input type="file" id="import-file" accept=".json" class="hidden">
    </div>
  </div>
  </div>
</div>
<div id="modal-root"></div>

<script>
'use strict';

// ============================================================
// 定数・ユーティリティ
// ============================================================
const STORAGE_KEY = 'higuri-data';
const DROPBOX_FILE = '/shikinguri-data.json';
const DROPBOX_TOKEN_KEY = 'higuri-dropbox-token';
const DROPBOX_PKCE_KEY = 'higuri-dropbox-pkce';
const MAX_FUTURE_YEARS = 1;

function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function pad2(n) { return String(n).padStart(2, '0'); }

function formatDate(y, m, d) {
  return `${y}-${pad2(m + 1)}-${pad2(d)}`;
}

function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function todayStr() {
  const t = new Date();
  return formatDate(t.getFullYear(), t.getMonth(), t.getDate());
}

function addMonths(y, m, delta) {
  m += delta;
  while (m > 11) { m -= 12; y++; }
  while (m < 0) { m += 12; y--; }
  return [y, m];
}

function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

function clampDay(y, m, day) {
  return Math.min(day, daysInMonth(y, m));
}

function formatYen(n) {
  if (n === 0) return '0';
  return n.toLocaleString('ja-JP');
}

function defaultData() {
  const today = todayStr();
  return {
    meta: { version: '1.0', lastUpdated: new Date().toISOString() },
    accounts: [
      { id: 'acc_001', name: '普通預金', type: '普通預金' },
      { id: 'acc_002', name: '当座預金', type: '当座預金' },
      { id: 'acc_003', name: '現金', type: '現金' }
    ],
    cards: [],
    loans: [],
    fixedCosts: [],
    entries: []
  };
}

// ============================================================
// データストア
// ============================================================
const Store = {
  data: null,
  selectedEntryId: null,
  viewStart: null,
  viewEnd: null,

  load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    this.data = raw ? JSON.parse(raw) : defaultData();
    const now = new Date();
    this.viewStart = formatDate(now.getFullYear(), now.getMonth(), 1);
    const end = addMonths(now.getFullYear(), now.getMonth(), 3);
    this.viewEnd = formatDate(end[0], end[1], daysInMonth(end[0], end[1]));
    return this.data;
  },

  save() {
    this.data.meta.lastUpdated = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
    UI.updateSyncBadge('local');
  },

  getAccount(id) {
    return this.data.accounts.find(a => a.id === id);
  },

  getCard(id) {
    return this.data.cards.find(c => c.id === id);
  },

  addEntry(entry) {
    if (!entry.id) entry.id = uid('e');
    this.data.entries.push(entry);
    this.save();
    return entry;
  },

  updateEntry(id, updates) {
    const e = this.data.entries.find(x => x.id === id);
    if (e) Object.assign(e, updates);
    this.save();
  },

  deleteEntry(id) {
    this.data.entries = this.data.entries.filter(x => x.id !== id);
    if (this.selectedEntryId === id) this.selectedEntryId = null;
    this.save();
  },

  getManualEntries() {
    return this.data.entries.filter(e =>
      e.source === 'manual' || e.source === 'cardSettlement'
    );
  }
};

// ============================================================
// カード引落ロジック
// ============================================================
const CardLogic = {
  getClosingDate(expenseDate, closingDay) {
    const d = parseDate(expenseDate);
    const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    if (day <= closingDay) {
      return formatDate(y, m, clampDay(y, m, closingDay));
    }
    const nm = addMonths(y, m, 1);
    return formatDate(nm[0], nm[1], clampDay(nm[0], nm[1], closingDay));
  },

  getPaymentDate(expenseDate, card) {
    const closing = this.getClosingDate(expenseDate, card.closingDay);
    const cd = parseDate(closing);
    const pm = addMonths(cd.getFullYear(), cd.getMonth(), card.paymentMonthOffset);
    return formatDate(pm[0], pm[1], clampDay(pm[0], pm[1], card.paymentDay));
  },

  getPeriodLabel(expenseDate, card) {
    const closing = this.getClosingDate(expenseDate, card.closingDay);
    const cd = parseDate(closing);
    const prevM = addMonths(cd.getFullYear(), cd.getMonth(), -1);
    const startDay = card.closingDay + 1;
    const start = formatDate(prevM[0], prevM[1], clampDay(prevM[0], prevM[1], startDay));
    return `${start.slice(5).replace('-', '/')}〜${closing.slice(5).replace('-', '/')}`;
  },

  applyToEntry(entry, card) {
    const payDate = this.getPaymentDate(entry.date, card);
    const period = this.getPeriodLabel(entry.date, card);
    return {
      ...entry,
      paymentMethod: 'card',
      cardId: card.id,
      accountId: card.accountId,
      skipped: true,
      skippedNote: `${card.name}の引落日(${payDate})に付替`,
      _originalAmount: entry.amount,
      _paymentDate: payDate,
      _period: period
    };
  }
};

// ============================================================
// エントリ自動生成
// ============================================================
const Generator = {
  dateRange(startStr, endStr) {
    const dates = [];
    let d = parseDate(startStr);
    const end = parseDate(endStr);
    while (d <= end) {
      dates.push(formatDate(d.getFullYear(), d.getMonth(), d.getDate()));
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
    return dates;
  },

  generateFixedCosts(data, startStr, endStr) {
    const entries = [];
    const dates = this.dateRange(startStr, endStr);
    for (const fc of data.fixedCosts) {
      if (!fc.active) continue;
      for (const dateStr of dates) {
        const d = parseDate(dateStr);
        if (fc.startDate && dateStr < fc.startDate) continue;
        if (fc.endDate && dateStr > fc.endDate) continue;
        if (d.getDate() !== fc.dueDay) continue;
        const entry = {
          id: `gen_fc_${fc.id}_${dateStr}`,
          date: dateStr,
          content: fc.name,
          type: 'expense',
          amount: fc.amount,
          accountId: fc.accountId,
          paymentMethod: fc.paymentMethod === '口座振替' ? 'transfer' :
                         fc.paymentMethod === 'card' ? 'card' : 'cash',
          cardId: fc.cardId || null,
          splitGroupId: null,
          source: 'fixedCost',
          skipped: false,
          _masterId: fc.id
        };
        if (entry.paymentMethod === 'card' && fc.cardId) {
          const card = data.cards.find(c => c.id === fc.cardId);
          if (card) Object.assign(entry, CardLogic.applyToEntry(entry, card));
        }
        entries.push(entry);
      }
    }
    return entries;
  },

  generateLoans(data, startStr, endStr) {
    const entries = [];
    const dates = this.dateRange(startStr, endStr);

    for (const loan of data.loans) {
      if (!loan.active) continue;

      if (loan.type === 'short') {
        if (loan.dueDate >= startStr && loan.dueDate <= endStr) {
          entries.push({
            id: `gen_loan_${loan.id}_${loan.dueDate}`,
            date: loan.dueDate,
            content: `${loan.name}（短期返済）`,
            type: 'expense',
            amount: loan.balance,
            accountId: loan.accountId,
            paymentMethod: 'transfer',
            source: 'loan',
            skipped: false,
            _masterId: loan.id
          });
        }
      } else if (loan.type === 'long') {
        let balance = loan.balance;
        if (balance <= 0) continue;
        for (const dateStr of dates) {
          const d = parseDate(dateStr);
          if (d.getDate() !== loan.paymentDay) continue;
          if (dateStr < (loan.startDate || '1900-01-01')) continue;
          const pay = Math.min(loan.monthlyPayment, balance);
          if (pay <= 0) break;
          entries.push({
            id: `gen_loan_${loan.id}_${dateStr}`,
            date: dateStr,
            content: `${loan.name}（返済）`,
            type: 'expense',
            amount: pay,
            accountId: loan.accountId,
            paymentMethod: 'transfer',
            source: 'loan',
            skipped: false,
            _masterId: loan.id
          });
          balance -= pay;
        }
      }
    }
    return entries;
  },

  generateCardSettlements(allEntries, data) {
    const settlements = [];
    const cardExpenses = allEntries.filter(e =>
      e.paymentMethod === 'card' && e.skipped && e._paymentDate
    );

    const groups = {};
    for (const e of cardExpenses) {
      const key = `${e.cardId}_${e._paymentDate}`;
      if (!groups[key]) groups[key] = [];
      groups[key].push(e);
    }

    for (const [key, items] of Object.entries(groups)) {
      const cardId = items[0].cardId;
      const card = data.cards.find(c => c.id === cardId);
      if (!card) continue;
      const payDate = items[0]._paymentDate;
      const total = items.reduce((s, e) => s + (e._originalAmount || e.amount), 0);
      const period = items[0]._period || '';
      const linkedIds = items.map(e => e.id);
      const existing = data.entries.find(e =>
        e.source === 'cardSettlement' && e.cardId === cardId && e.date === payDate
      );
      settlements.push({
        id: existing ? existing.id : `gen_settle_${cardId}_${payDate}`,
        date: payDate,
        content: `${card.name}引落（${period}・${items.length}件）`,
        type: 'expense',
        amount: total,
        accountId: card.accountId,
        paymentMethod: 'cardSettlement',
        cardId: cardId,
        source: 'cardSettlement',
        skipped: false,
        linkedEntryIds: linkedIds,
        _generated: !existing
      });
    }
    return settlements;
  },

  buildAll(data, startStr, endStr) {
    const manual = Store.getManualEntries();
    const extStart = this.extendStartForCard(data, manual, startStr);
    const fixed = this.generateFixedCosts(data, extStart, endStr);
    const loans = this.generateLoans(data, extStart, endStr);
    let all = [...manual, ...fixed, ...loans];

    for (const e of all) {
      if (e.paymentMethod === 'card' && !e.skipped && e.cardId) {
        const card = data.cards.find(c => c.id === e.cardId);
        if (card) Object.assign(e, CardLogic.applyToEntry(e, card));
      }
    }

    const settlements = this.generateCardSettlements(all, data);
    const savedSettleIds = new Set(manual.filter(e => e.source === 'cardSettlement').map(e => e.id));
    all = all.filter(e => e.source !== 'cardSettlement' || savedSettleIds.has(e.id));
    all = [...all, ...settlements];

    all.sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      const order = { cardSettlement: 1, loan: 2, fixedCost: 3, manual: 4 };
      return (order[a.source] || 5) - (order[b.source] || 5);
    });
    return all;
  },

  extendStartForCard(data, manual, startStr) {
    let earliest = startStr;
    for (const e of manual) {
      if (e.paymentMethod === 'card' && e.cardId) {
        const card = data.cards.find(c => c.id === e.cardId);
        if (card) {
          const payDate = CardLogic.getPaymentDate(e.date, card);
          if (payDate >= startStr && e.date < earliest) earliest = e.date;
        }
      }
    }
    return earliest;
  }
};

// ============================================================
// 残高計算・表示行生成
// ============================================================
const Calculator = {
  effectiveAmount(entry) {
    if (entry.skipped) return 0;
    return entry.amount;
  },

  buildDisplayRows(entries, accounts, viewStart, viewEnd) {
    const sorted = [...entries].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    let balance = 0;
    for (const e of sorted) {
      if (e.date >= viewStart) break;
      const amt = this.effectiveAmount(e);
      balance += e.type === 'income' ? amt : -amt;
    }

    const filtered = sorted.filter(e => e.date >= viewStart && e.date <= viewEnd);
    const byDate = {};
    for (const e of filtered) {
      if (!byDate[e.date]) byDate[e.date] = [];
      byDate[e.date].push(e);
    }

    const dates = Object.keys(byDate).sort();
    const rows = [];
    const accountBalances = {};
    accounts.forEach(a => { accountBalances[a.id] = 0; });

    for (const date of dates) {
      const dayEntries = byDate[date];
      let dayIncome = 0, dayExpense = 0;
      let hasMovement = false;

      for (const e of dayEntries) {
        const amt = this.effectiveAmount(e);
        if (amt !== 0 || e.skipped) hasMovement = true;
        if (e.type === 'income') dayIncome += amt;
        else dayExpense += amt;
      }

      if (!hasMovement) continue;

      balance += dayIncome - dayExpense;
      for (const e of dayEntries) {
        const amt = this.effectiveAmount(e);
        if (e.accountId && amt !== 0) {
          accountBalances[e.accountId] += e.type === 'income' ? amt : -amt;
        }
      }

      for (const e of dayEntries) {
        rows.push({
          ...e,
          displayAmount: e.skipped ? 0 : e.amount,
          originalAmount: e.skipped ? (e._originalAmount || e.amount) : e.amount,
          runningBalance: null
        });
      }
      const lastRow = rows[rows.length - 1];
      if (lastRow) lastRow.runningBalance = balance;
      rows[rows.length - 1]._dayIncome = dayIncome;
      rows[rows.length - 1]._dayExpense = dayExpense;
      rows[rows.length - 1]._accountBalances = { ...accountBalances };
    }

    for (let i = 0; i < rows.length; i++) {
      if (rows[i].runningBalance === null) {
        for (let j = i; j < rows.length; j++) {
          if (rows[j].runningBalance !== null) {
            rows[i].runningBalance = rows[j].runningBalance;
            break;
          }
        }
      }
    }
    return rows;
  },

  getSplitGroups(rows) {
    const groups = {};
    for (const r of rows) {
      if (r.splitGroupId) {
        if (!groups[r.splitGroupId]) groups[r.splitGroupId] = [];
        groups[r.splitGroupId].push(r);
      }
    }
    return groups;
  }
};

// ============================================================
// UI
// ============================================================
const UI = {
  init() {
    Store.load();
    this.bindTabs();
    this.bindToolbar();
    this.bindMasters();
    this.bindSettings();
    this.setViewMonths();
    this.renderAll();
    Dropbox.handleCallback();
  },

  setViewMonths() {
    const s = parseDate(Store.viewStart);
    const e = parseDate(Store.viewEnd);
    document.getElementById('view-start').value = `${s.getFullYear()}-${pad2(s.getMonth() + 1)}`;
    document.getElementById('view-end').value = `${e.getFullYear()}-${pad2(e.getMonth() + 1)}`;
  },

  bindTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        document.getElementById('ledger-toolbar').style.display =
          tab.dataset.tab === 'ledger' ? 'flex' : 'none';
      });
    });
  },

  bindToolbar() {
    document.getElementById('btn-add-entry').onclick = () => Modal.openEntry();
    document.getElementById('btn-edit-entry').onclick = () => {
      if (Store.selectedEntryId) Modal.openEntry(Store.selectedEntryId);
    };
    document.getElementById('btn-split-entry').onclick = () => {
      if (Store.selectedEntryId) Modal.openSplit(Store.selectedEntryId);
    };
    document.getElementById('btn-card-switch').onclick = () => {
      if (Store.selectedEntryId) Modal.openCardSwitch(Store.selectedEntryId);
    };
    document.getElementById('btn-delete-entry').onclick = () => {
      if (Store.selectedEntryId && confirm('この行を削除しますか？')) {
        Store.deleteEntry(Store.selectedEntryId);
        this.renderLedger();
      }
    };
    document.getElementById('view-start').onchange = (e) => {
      const [y, m] = e.target.value.split('-').map(Number);
      Store.viewStart = formatDate(y, m - 1, 1);
      this.renderLedger();
    };
    document.getElementById('view-end').onchange = (e) => {
      const [y, m] = e.target.value.split('-').map(Number);
      Store.viewEnd = formatDate(y, m - 1, daysInMonth(y, m - 1));
      this.renderLedger();
    };
  },

  bindMasters() {
    document.getElementById('btn-add-account').onclick = () => Modal.openAccount();
    document.getElementById('btn-add-card').onclick = () => Modal.openCard();
    document.getElementById('btn-add-loan').onclick = () => Modal.openLoan();
    document.getElementById('btn-add-fixedcost').onclick = () => Modal.openFixedCost();
  },

  bindSettings() {
    const key = localStorage.getItem('higuri-dropbox-app-key') || '';
    document.getElementById('dropbox-app-key').value = key;
    document.getElementById('dropbox-app-key').onchange = (e) => {
      localStorage.setItem('higuri-dropbox-app-key', e.target.value);
    };
    document.getElementById('btn-dropbox-connect').onclick = () => Dropbox.connect();
    document.getElementById('btn-dropbox-sync').onclick = () => Dropbox.sync();
    document.getElementById('btn-dropbox-disconnect').onclick = () => Dropbox.disconnect();
    document.getElementById('btn-export').onclick = () => {
      const blob = new Blob([JSON.stringify(Store.data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'shikinguri-data.json';
      a.click();
    };
    document.getElementById('btn-import').onclick = () => document.getElementById('import-file').click();
    document.getElementById('import-file').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          Store.data = JSON.parse(ev.target.result);
          Store.save();
          this.renderAll();
          alert('インポートしました');
        } catch { alert('JSONの読み込みに失敗しました'); }
      };
      reader.readAsText(file);
    };
    Dropbox.updateStatus();
  },

  updateSyncBadge(state, msg) {
    const el = document.getElementById('sync-badge');
    el.className = 'sync-status ' + (state === 'ok' ? 'ok' : state === 'warn' ? 'warn' : 'err');
    el.textContent = msg || (state === 'ok' ? 'ローカル' : state === 'warn' ? '要確認' : 'エラー');
  },

  renderAll() {
    this.renderLedger();
    this.renderMasters();
  },

  renderLedger() {
    const data = Store.data;
    const accounts = data.accounts;
    const maxDate = formatDate(
      new Date().getFullYear() + MAX_FUTURE_YEARS,
      new Date().getMonth(),
      new Date().getDate()
    );
    const endStr = Store.viewEnd < maxDate ? Store.viewEnd : maxDate;
    const entries = Generator.buildAll(data, Store.viewStart, endStr);
    const rows = Calculator.buildDisplayRows(entries, accounts, Store.viewStart, endStr);
    const splitGroups = Calculator.getSplitGroups(rows);

    const thead = document.getElementById('ledger-head');
    const tbody = document.getElementById('ledger-body');
    let headHtml = '<tr><th>月日</th><th>内容</th>';
    accounts.forEach(a => { headHtml += `<th>${a.name}</th>`; });
    headHtml += '<th>入金</th><th>出金</th><th>残高</th></tr>';
    thead.innerHTML = headHtml;

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${accounts.length + 5}" class="empty-msg">表示期間内にデータがありません</td></tr>`;
      return;
    }

    let html = '';
    const shownSplitTotals = new Set();

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const isSkipped = r.skipped;
      const isSettlement = r.source === 'cardSettlement';
      const isSelected = r.id === Store.selectedEntryId;
      let cls = isSkipped ? 'skipped' : '';
      if (isSettlement) cls += ' settlement';
      if (isSelected) cls += ' selected';

      if (r.splitGroupId) {
        const grp = splitGroups[r.splitGroupId];
        const idx = grp.indexOf(r);
        if (idx === 0) cls += ' split-group split-group-first';
        else if (idx === grp.length - 1) cls += ' split-group split-group-last';
        else cls += ' split-group';
      }

      const dateDisplay = r.date.slice(5).replace('-', '/');
      let content = this.esc(r.content);
      if (isSkipped && r.skippedNote) {
        content += ` <span class="split-total">(${this.esc(r.skippedNote)})</span>`;
      }
      if (r.splitGroupId && !shownSplitTotals.has(r.splitGroupId)) {
        const grp = splitGroups[r.splitGroupId];
        const total = grp.reduce((s, x) => s + (x.skipped ? 0 : x.amount), 0);
        const type = grp[0].type;
        content += ` <span class="split-total">[分割合計: ${formatYen(total)}円]</span>`;
        shownSplitTotals.add(r.splitGroupId);
      }

      html += `<tr class="${cls}" data-id="${r.id}">`;
      html += `<td class="date">${dateDisplay}</td>`;
      html += `<td>${content}</td>`;

      accounts.forEach(a => {
        let val = '';
        if (r.accountId === a.id) {
          const amt = r.displayAmount;
          if (amt > 0 && r.type === 'income') val = formatYen(amt);
          else if (amt > 0 && r.type === 'expense') val = '-' + formatYen(amt);
          else if (isSkipped && r.originalAmount > 0) val = `(${formatYen(r.originalAmount)})`;
        }
        html += `<td class="num">${val}</td>`;
      });

      const income = r.type === 'income' && !isSkipped ? formatYen(r.displayAmount) : '';
      const expense = r.type === 'expense' && !isSkipped ? formatYen(r.displayAmount) : '';
      html += `<td class="num income">${income}</td>`;
      html += `<td class="num expense">${expense}</td>`;
      html += `<td class="num">${r.runningBalance !== null ? formatYen(r.runningBalance) : ''}</td>`;
      html += '</tr>';
    }
    tbody.innerHTML = html;

    tbody.querySelectorAll('tr[data-id]').forEach(tr => {
      tr.addEventListener('click', () => {
        const id = tr.dataset.id;
        const entry = Store.data.entries.find(e => e.id === id) ||
          entries.find(e => e.id === id);
        if (!entry || entry.source === 'fixedCost' || entry.source === 'loan') {
          if (entry && entry.source === 'cardSettlement') {
            this.showSettlementDetail(entry);
          }
          return;
        }
        Store.selectedEntryId = id;
        tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
        tr.classList.add('selected');
        this.updateToolbarState();
      });
      if (tr.classList.contains('settlement')) {
        tr.addEventListener('dblclick', () => {
          const entry = entries.find(e => e.id === tr.dataset.id);
          if (entry) this.showSettlementDetail(entry);
        });
      }
    });
    this.updateToolbarState();
  },

  showSettlementDetail(entry) {
    const panel = document.getElementById('detail-panel');
    const linked = (entry.linkedEntryIds || []).map(id => {
      const e = Store.data.entries.find(x => x.id === id);
      return e ? `<li>${e.date} ${this.esc(e.content)} — ${formatYen(e._originalAmount || e.amount)}円</li>` : '';
    }).join('');
    panel.innerHTML = `<h4>${this.esc(entry.content)}</h4><p>引落金額: <strong>${formatYen(entry.amount)}円</strong></p><ul>${linked || '<li>内訳なし</li>'}</ul>`;
    panel.classList.remove('hidden');
  },

  updateToolbarState() {
    const id = Store.selectedEntryId;
    const entry = id ? Store.data.entries.find(e => e.id === id) : null;
    const editable = entry && entry.source === 'manual';
    document.getElementById('btn-edit-entry').disabled = !editable;
    document.getElementById('btn-split-entry').disabled = !editable;
    document.getElementById('btn-card-switch').disabled = !editable || entry?.type !== 'expense' || entry?.paymentMethod === 'card';
    document.getElementById('btn-delete-entry').disabled = !editable;
  },

  renderMasters() {
    const d = Store.data;
    this.renderMasterList('accounts-list', d.accounts, a =>
      `<div class="name">${this.esc(a.name)}</div><div class="detail">${this.esc(a.type)}</div>`,
      (a) => Modal.openAccount(a.id)
    );
    this.renderMasterList('cards-list', d.cards, c => {
      const acc = Store.getAccount(c.accountId);
      return `<div class="name">${this.esc(c.name)}</div><div class="detail">${c.closingDay}日締め / 引落${c.paymentMonthOffset}ヶ月後${c.paymentDay}日 (${acc?.name || ''})</div>`;
    }, (c) => Modal.openCard(c.id));
    this.renderMasterList('loans-list', d.loans, l => {
      const acc = Store.getAccount(l.accountId);
      const detail = l.type === 'long'
        ? `長期 / 残高${formatYen(l.balance)}円 / 月${formatYen(l.monthlyPayment)}円 / ${l.paymentDay}日`
        : `短期 / 残高${formatYen(l.balance)}円 / 期日${l.dueDate}`;
      return `<div class="name">${this.esc(l.name)}</div><div class="detail">${detail} (${acc?.name || ''}) ${l.active ? '' : '[無効]'}</div>`;
    }, (l) => Modal.openLoan(l.id));
    this.renderMasterList('fixedcosts-list', d.fixedCosts, fc => {
      const acc = Store.getAccount(fc.accountId);
      return `<div class="name">${this.esc(fc.name)}</div><div class="detail">${formatYen(fc.amount)}円 / 毎月${fc.dueDay}日 / ${fc.paymentMethod} (${acc?.name || ''}) ${fc.active ? '' : '[無効]'}</div>`;
    }, (fc) => Modal.openFixedCost(fc.id));
  },

  renderMasterList(containerId, items, renderFn, onClick) {
    const el = document.getElementById(containerId);
    if (items.length === 0) {
      el.innerHTML = '<div class="empty-msg" style="padding:12px">登録なし</div>';
      return;
    }
    el.innerHTML = items.map(item => `
      <div class="master-item" data-id="${item.id}">
        <div class="info">${renderFn(item)}</div>
        <button class="edit-btn">編集</button>
      </div>
    `).join('');
    el.querySelectorAll('.master-item').forEach(row => {
      row.querySelector('.edit-btn').onclick = () => onClick(items.find(x => x.id === row.dataset.id));
    });
  },

  esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
};

// ============================================================
// モーダル
// ============================================================
const Modal = {
  open(html, onSave) {
    const root = document.getElementById('modal-root');
    root.innerHTML = `<div class="modal-overlay" id="modal-overlay">
      <div class="modal">${html}</div>
    </div>`;
    root.querySelector('#modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') this.close();
    });
    const saveBtn = root.querySelector('[data-action="save"]');
    if (saveBtn) saveBtn.onclick = () => { if (onSave()) this.close(); };
    const cancelBtn = root.querySelector('[data-action="cancel"]');
    if (cancelBtn) cancelBtn.onclick = () => this.close();
  },

  close() {
    document.getElementById('modal-root').innerHTML = '';
  },

  accountOptions(selected) {
    return Store.data.accounts.map(a =>
      `<option value="${a.id}" ${a.id === selected ? 'selected' : ''}>${UI.esc(a.name)}</option>`
    ).join('');
  },

  cardOptions(selected) {
    return Store.data.cards.map(c =>
      `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${UI.esc(c.name)}</option>`
    ).join('');
  },

  openEntry(id) {
    const entry = id ? Store.data.entries.find(e => e.id === id) : null;
    const isNew = !entry;
    const e = entry || {
      date: todayStr(), content: '', type: 'expense', amount: 0,
      accountId: Store.data.accounts[0]?.id, paymentMethod: 'cash', source: 'manual'
    };
    this.open(`
      <h3>${isNew ? '入出金追加' : '入出金編集'}</h3>
      <div class="form-row"><label>日付</label><input type="date" id="f-date" value="${e.date}"></div>
      <div class="form-row"><label>内容</label><input type="text" id="f-content" value="${UI.esc(e.content)}"></div>
      <div class="form-row"><label>区分</label>
        <select id="f-type"><option value="income" ${e.type==='income'?'selected':''}>入金</option>
        <option value="expense" ${e.type==='expense'?'selected':''}>出金</option></select></div>
      <div class="form-row"><label>金額</label><input type="number" id="f-amount" value="${e.amount}" min="0"></div>
      <div class="form-row"><label>口座</label><select id="f-account">${this.accountOptions(e.accountId)}</select></div>
      <div class="form-row"><label>支払方法</label>
        <select id="f-method">
          <option value="cash" ${e.paymentMethod==='cash'?'selected':''}>現金</option>
          <option value="transfer" ${e.paymentMethod==='transfer'?'selected':''}>口座振替</option>
        </select></div>
      <div class="form-actions">
        <button data-action="cancel">キャンセル</button>
        <button data-action="save" class="primary">保存</button>
      </div>
    `, () => {
      const data = {
        date: document.getElementById('f-date').value,
        content: document.getElementById('f-content').value,
        type: document.getElementById('f-type').value,
        amount: Number(document.getElementById('f-amount').value) || 0,
        accountId: document.getElementById('f-account').value,
        paymentMethod: document.getElementById('f-method').value,
        source: 'manual', skipped: false, splitGroupId: e.splitGroupId || null
      };
      if (!data.content) { alert('内容を入力してください'); return false; }
      if (isNew) Store.addEntry(data);
      else Store.updateEntry(id, data);
      UI.renderLedger();
      return true;
    });
  },

  openSplit(id) {
    const entry = Store.data.entries.find(e => e.id === id);
    if (!entry) return;
    this.open(`
      <h3>行の分割</h3>
      <p style="font-size:13px;color:#666">元の金額: ${formatYen(entry.amount)}円（${UI.esc(entry.content)}）</p>
      <div class="form-row"><label>分割数</label><input type="number" id="f-parts" value="2" min="2" max="10"></div>
      <div id="split-amounts"></div>
      <div class="form-actions">
        <button data-action="cancel">キャンセル</button>
        <button data-action="save" class="primary">分割実行</button>
      </div>
    `, () => {
      const parts = Number(document.getElementById('f-parts').value) || 2;
      const inputs = document.querySelectorAll('.split-amt');
      const amounts = Array.from(inputs).map(i => Number(i.value) || 0);
      const total = amounts.reduce((s, v) => s + v, 0);
      if (total !== entry.amount) {
        alert(`合計が元の金額(${formatYen(entry.amount)}円)と一致しません（現在: ${formatYen(total)}円）`);
        return false;
      }
      const groupId = entry.splitGroupId || uid('split');
      Store.deleteEntry(id);
      amounts.forEach((amt, i) => {
        Store.addEntry({
          date: entry.date, content: `${entry.content} (${i + 1}/${parts})`,
          type: entry.type, amount: amt, accountId: entry.accountId,
          paymentMethod: entry.paymentMethod, source: 'manual',
          splitGroupId: groupId, skipped: false
        });
      });
      UI.renderLedger();
      return true;
    });
    const updateSplitInputs = () => {
      const parts = Number(document.getElementById('f-parts').value) || 2;
      const each = Math.floor(entry.amount / parts);
      const remainder = entry.amount - each * parts;
      let html = '';
      for (let i = 0; i < parts; i++) {
        const val = each + (i === parts - 1 ? remainder : 0);
        html += `<div class="form-row"><label>${i + 1}件目</label><input type="number" class="split-amt" value="${val}" min="0"></div>`;
      }
      document.getElementById('split-amounts').innerHTML = html;
    };
    document.getElementById('f-parts').onchange = updateSplitInputs;
    updateSplitInputs();
  },

  openCardSwitch(id) {
    const entry = Store.data.entries.find(e => e.id === id);
    if (!entry || Store.data.cards.length === 0) {
      alert('カードが登録されていません。マスタ管理でカードを追加してください。');
      return;
    }
    this.open(`
      <h3>カード払いに切替</h3>
      <p style="font-size:13px;color:#666">${UI.esc(entry.content)} — ${formatYen(entry.amount)}円</p>
      <div class="form-row"><label>カード</label><select id="f-card">${this.cardOptions(Store.data.cards[0].id)}</select></div>
      <div class="form-actions">
        <button data-action="cancel">キャンセル</button>
        <button data-action="save" class="primary">切替</button>
      </div>
    `, () => {
      const cardId = document.getElementById('f-card').value;
      const card = Store.getCard(cardId);
      const updated = CardLogic.applyToEntry({ ...entry }, card);
      Store.updateEntry(id, {
        paymentMethod: 'card', cardId, accountId: card.accountId,
        skipped: true, skippedNote: updated.skippedNote,
        _originalAmount: entry.amount, _paymentDate: updated._paymentDate, _period: updated._period
      });
      UI.renderLedger();
      return true;
    });
  },

  openAccount(id) {
    const a = id ? Store.data.accounts.find(x => x.id === id) : null;
    const isNew = !a;
    const item = a || { name: '', type: '普通預金' };
    this.open(`
      <h3>${isNew ? '口座追加' : '口座編集'}</h3>
      <div class="form-row"><label>名称</label><input type="text" id="f-name" value="${UI.esc(item.name)}"></div>
      <div class="form-row"><label>種別</label>
        <select id="f-type">
          <option ${item.type==='普通預金'?'selected':''}>普通預金</option>
          <option ${item.type==='当座預金'?'selected':''}>当座預金</option>
          <option ${item.type==='現金'?'selected':''}>現金</option>
          <option ${item.type==='その他'?'selected':''}>その他</option>
        </select></div>
      ${isNew ? '' : `<div class="form-actions"><button data-action="delete" style="color:#a00;margin-right:auto">削除</button></div>`}
      <div class="form-actions">
        <button data-action="cancel">キャンセル</button>
        <button data-action="save" class="primary">保存</button>
      </div>
    `, () => {
      const name = document.getElementById('f-name').value;
      const type = document.getElementById('f-type').value;
      if (!name) { alert('名称を入力してください'); return false; }
      if (isNew) Store.data.accounts.push({ id: uid('acc'), name, type });
      else Object.assign(a, { name, type });
      Store.save(); UI.renderAll();
      return true;
    });
    if (!isNew) {
      document.querySelector('[data-action="delete"]').onclick = () => {
        if (confirm('この口座を削除しますか？')) {
          Store.data.accounts = Store.data.accounts.filter(x => x.id !== id);
          Store.save(); UI.renderAll(); this.close();
        }
      };
    }
  },

  openCard(id) {
    const c = id ? Store.data.cards.find(x => x.id === id) : null;
    const isNew = !c;
    const item = c || { name: '', closingDay: 15, paymentDay: 10, paymentMonthOffset: 1, accountId: Store.data.accounts[0]?.id };
    this.open(`
      <h3>${isNew ? 'カード追加' : 'カード編集'}</h3>
      <div class="form-row"><label>名称</label><input type="text" id="f-name" value="${UI.esc(item.name)}"></div>
      <div class="form-row"><label>締め日</label><input type="number" id="f-close" value="${item.closingDay}" min="1" max="31"></div>
      <div class="form-row"><label>引落月（締めから何ヶ月後）</label><input type="number" id="f-offset" value="${item.paymentMonthOffset}" min="0" max="3"></div>
      <div class="form-row"><label>引落日</label><input type="number" id="f-payday" value="${item.paymentDay}" min="1" max="31"></div>
      <div class="form-row"><label>引落口座</label><select id="f-account">${this.accountOptions(item.accountId)}</select></div>
      <div class="form-actions">
        ${isNew ? '' : '<button data-action="delete" style="color:#a00;margin-right:auto">削除</button>'}
        <button data-action="cancel">キャンセル</button>
        <button data-action="save" class="primary">保存</button>
      </div>
    `, () => {
      const data = {
        name: document.getElementById('f-name').value,
        closingDay: Number(document.getElementById('f-close').value),
        paymentMonthOffset: Number(document.getElementById('f-offset').value),
        paymentDay: Number(document.getElementById('f-payday').value),
        accountId: document.getElementById('f-account').value
      };
      if (!data.name) { alert('名称を入力してください'); return false; }
      if (isNew) Store.data.cards.push({ id: uid('card'), ...data });
      else Object.assign(c, data);
      Store.save(); UI.renderAll();
      return true;
    });
    if (!isNew) {
      document.querySelector('[data-action="delete"]').onclick = () => {
        if (confirm('このカードを削除しますか？')) {
          Store.data.cards = Store.data.cards.filter(x => x.id !== id);
          Store.save(); UI.renderAll(); this.close();
        }
      };
    }
  },

  openLoan(id) {
    const l = id ? Store.data.loans.find(x => x.id === id) : null;
    const isNew = !l;
    const item = l || { name: '', type: 'long', principal: 0, balance: 0, monthlyPayment: 0, paymentDay: 27, dueDate: '', accountId: Store.data.accounts[0]?.id, startDate: todayStr(), active: true };
    this.open(`
      <h3>${isNew ? '借入金追加' : '借入金編集'}</h3>
      <div class="form-row"><label>名称</label><input type="text" id="f-name" value="${UI.esc(item.name)}"></div>
      <div class="form-row"><label>種別</label>
        <select id="f-ltype"><option value="long" ${item.type==='long'?'selected':''}>長期</option>
        <option value="short" ${item.type==='short'?'selected':''}>短期</option></select></div>
      <div class="form-row"><label>残高</label><input type="number" id="f-balance" value="${item.balance}" min="0"></div>
      <div class="form-row long-field"><label>月額返済</label><input type="number" id="f-monthly" value="${item.monthlyPayment||0}" min="0"></div>
      <div class="form-row long-field"><label>返済日（毎月）</label><input type="number" id="f-pday" value="${item.paymentDay||27}" min="1" max="31"></div>
      <div class="form-row short-field"><label>期日</label><input type="date" id="f-due" value="${item.dueDate||''}"></div>
      <div class="form-row"><label>開始日</label><input type="date" id="f-start" value="${item.startDate||todayStr()}"></div>
      <div class="form-row"><label>引落口座</label><select id="f-account">${this.accountOptions(item.accountId)}</select></div>
      <div class="form-row"><label><input type="checkbox" id="f-active" ${item.active?'checked':''}> 有効</label></div>
      <div class="form-actions">

    `, () => {
      const type = document.getElementById('f-ltype').value;

        name: document.getElementById('f-name').value,

        balance: Number(document.getElementById('f-balance').value) || 0,
        accountId: document.getElementById('f-account').value,
        startDate: document.getElementById('f-start').value,
        active: document.getElementById('f-active').checked

      if (type === 'long') {
        data.monthlyPayment = Number(document.getElementById('f-monthly').value) || 0;
        data.paymentDay = Number(document.getElementById('f-pday').value);
        data.principal = data.principal || data.balance;
      } else {
        data.dueDate = document.getElementById('f-due').value;
        data.principal = data.principal || data.balance;
      }
      if (!data.name) { alert('名称を入力してください'); return false; }
      if (isNew) Store.data.loans.push({ id: uid('loan'), ...data });
      else Object.assign(l, data);
      Store.save(); UI.renderAll();
      return true;
    });
    const toggle = () => {
      const t = document.getElementById('f-ltype').value;
      document.querySelectorAll('.long-field').forEach(el => el.style.display = t === 'long' ? '' : 'none');
      document.querySelectorAll('.short-field').forEach(el => el.style.display = t === 'short' ? '' : 'none');
    };
    document.getElementById('f-ltype').onchange = toggle;
    toggle();
    if (!isNew) {
      document.querySelector('[data-action="delete"]').onclick = () => {
        if (confirm('この借入金を削除しますか？')) {
          Store.data.loans = Store.data.loans.filter(x => x.id !== id);
          Store.save(); UI.renderAll(); this.close();
        }
      };
    }
  },

  openFixedCost(id) {
    const fc = id ? Store.data.fixedCosts.find(x => x.id === id) : null;
    const isNew = !fc;
    const item = fc || { name: '', amount: 0, dueDay: 27, accountId: Store.data.accounts[0]?.id, paymentMethod: '口座振替', cardId: null, startDate: null, endDate: null, active: true };
    this.open(`
      <h3>${isNew ? '固定費追加' : '固定費編集'}</h3>
      <div class="form-row"><label>名称</label><input type="text" id="f-name" value="${UI.esc(item.name)}"></div>
      <div class="form-row"><label>金額</label><input type="number" id="f-amount" value="${item.amount}" min="0"></div>
      <div class="form-row"><label>支払日（毎月）</label><input type="number" id="f-due" value="${item.dueDay}" min="1" max="31"></div>
      <div class="form-row"><label>口座</label><select id="f-account">${this.accountOptions(item.accountId)}</select></div>
      <div class="form-row"><label>支払方法</label>
        <select id="f-method">
          <option ${item.paymentMethod==='現金'?'selected':''}>現金</option>
          <option ${item.paymentMethod==='口座振替'?'selected':''}>口座振替</option>
          <option ${item.paymentMethod==='card'?'selected':''}>カード払い</option>
        </select></div>
      <div class="form-row card-field"><label>カード</label><select id="f-card"><option value="">--</option>${this.cardOptions(item.cardId)}</select></div>
      <div class="form-row"><label>開始日（任意）</label><input type="date" id="f-start" value="${item.startDate||''}"></div>
      <div class="form-row"><label>終了日（任意）</label><input type="date" id="f-end" value="${item.endDate||''}"></div>
      <div class="form-row"><label><input type="checkbox" id="f-active" ${item.active?'checked':''}> 有効</label></div>
      <div class="form-actions">
        ${isNew ? '' : '<button data-action="delete" style="color:#a00;margin-right:auto">削除</button>'}
        <button data-action="cancel">キャンセル</button>
        <button data-action="save" class="primary">保存</button>
      </div>
    `, () => {
      const method = document.getElementById('f-method').value;
      const data = {
        name: document.getElementById('f-name').value,
        amount: Number(document.getElementById('f-amount').value) || 0,
        dueDay: Number(document.getElementById('f-due').value),
        accountId: document.getElementById('f-account').value,
        paymentMethod: method,
        cardId: method === 'card' ? document.getElementById('f-card').value || null : null,
        startDate: document.getElementById('f-start').value || null,
        endDate: document.getElementById('f-end').value || null,
        active: document.getElementById('f-active').checked
      };
      if (!data.name) { alert('名称を入力してください'); return false; }
      if (isNew) Store.data.fixedCosts.push({ id: uid('fc'), ...data });
      else Object.assign(fc, data);
      Store.save(); UI.renderAll();
      return true;
    });
    const toggle = () => {
      document.querySelector('.card-field').style.display =
        document.getElementById('f-method').value === 'card' ? '' : 'none';
    };
    document.getElementById('f-method').onchange = toggle;
    toggle();
    if (!isNew) {
      document.querySelector('[data-action="delete"]').onclick = () => {
        if (confirm('この固定費を削除しますか？')) {
          Store.data.fixedCosts = Store.data.fixedCosts.filter(x => x.id !== id);
          Store.save(); UI.renderAll(); this.close();
        }
      };
    }
  }
};

// ============================================================
// Dropbox同期（PKCE OAuth）
// ============================================================
const Dropbox = {
  getAppKey() {
    return document.getElementById('dropbox-app-key')?.value ||
      localStorage.getItem('higuri-dropbox-app-key') || '';
  },

  getToken() {
    const raw = localStorage.getItem(DROPBOX_TOKEN_KEY);
    return raw ? JSON.parse(raw) : null;
  },

  setToken(token) {
    localStorage.setItem(DROPBOX_TOKEN_KEY, JSON.stringify(token));
  },

  async generatePKCE() {
    const verifier = Array.from(crypto.getRandomValues(new Uint8Array(32)))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    const challenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return { verifier, challenge };
  },

  async connect() {
    const appKey = this.getAppKey();
    if (!appKey) { alert('Dropbox App Keyを入力してください'); return; }
    const pkce = await this.generatePKCE();
    sessionStorage.setItem(DROPBOX_PKCE_KEY, pkce.verifier);
    const redirectUri = window.location.href.split('?')[0].split('#')[0];
    const url = `https://www.dropbox.com/oauth2/authorize?client_id=${appKey}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&code_challenge=${pkce.challenge}&code_challenge_method=S256&token_access_type=offline`;
    window.location.href = url;
  },

  async handleCallback() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (!code) return;
    const verifier = sessionStorage.getItem(DROPBOX_PKCE_KEY);
    if (!verifier) return;
    const appKey = this.getAppKey();
    const redirectUri = window.location.href.split('?')[0].split('#')[0];
    try {
      const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          code, grant_type: 'authorization_code',
          client_id: appKey, redirect_uri: redirectUri,
          code_verifier: verifier
        })
      });
      const data = await res.json();
      if (data.access_token) {
        this.setToken({ access_token: data.access_token, refresh_token: data.refresh_token, obtained: Date.now() });
        sessionStorage.removeItem(DROPBOX_PKCE_KEY);
        window.history.replaceState({}, '', redirectUri);
        await this.sync();
      } else {
        alert('Dropbox認証に失敗しました: ' + (data.error_description || data.error));
      }
    } catch (e) {
      alert('Dropbox認証エラー: ' + e.message);
    }
    this.updateStatus();
  },

  async apiFetch(url, options = {}) {
    const token = this.getToken();
    if (!token) throw new Error('未接続');
    const res = await fetch(url, {
      ...options,
      headers: { ...options.headers, Authorization: `Bearer ${token.access_token}` }
    });
    if (res.status === 401 && token.refresh_token) {
      await this.refreshToken();
      return this.apiFetch(url, options);
    }
    return res;
  },

  async refreshToken() {
    const token = this.getToken();
    const appKey = this.getAppKey();
    const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'refresh_token', refresh_token: token.refresh_token, client_id: appKey
      })
    });
    const data = await res.json();
    if (data.access_token) {
      this.setToken({ ...token, access_token: data.access_token, obtained: Date.now() });
    } else throw new Error('トークン更新失敗');
  },

  async sync() {
    if (!this.getToken()) { alert('Dropboxに接続してください'); return; }
    UI.updateSyncBadge('warn', '同期中...');
    try {
      const dlRes = await this.apiFetch('https://content.dropboxapi.com/2/files/download', {
        method: 'POST',
        headers: { 'Dropbox-API-Arg': JSON.stringify({ path: DROPBOX_FILE }) }
      });
      if (dlRes.ok) {
        const remoteText = await dlRes.text();
        const remote = JSON.parse(remoteText);
        const local = Store.data;
        const remoteTime = new Date(remote.meta?.lastUpdated || 0);
        const localTime = new Date(local.meta?.lastUpdated || 0);
        if (remoteTime > localTime) {
          const useRemote = localTime.getTime() === 0 || confirm(
            `Dropboxのデータ(${remoteTime.toLocaleString()})の方が新しいです。Dropboxのデータを使いますか？`
          );
          if (useRemote) {
            Store.data = remote;
            Store.save();
          }
        }
      } else if (dlRes.status !== 409) {
        const err = await dlRes.text();
        console.warn('Download:', err);
      }

      const uploadRes = await this.apiFetch('https://content.dropboxapi.com/2/files/upload', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/octet-stream',
          'Dropbox-API-Arg': JSON.stringify({ path: DROPBOX_FILE, mode: 'overwrite', mute: true })
        },
        body: JSON.stringify(Store.data)
      });
      if (!uploadRes.ok) throw new Error(await uploadRes.text());
      UI.updateSyncBadge('ok', '同期済');
      UI.renderAll();
    } catch (e) {
      UI.updateSyncBadge('err', '同期失敗');
      alert('同期エラー: ' + e.message);
    }
  },

  disconnect() {
    localStorage.removeItem(DROPBOX_TOKEN_KEY);
    this.updateStatus();
  },

  updateStatus() {
    const token = this.getToken();
    const status = document.getElementById('dropbox-status');
    const syncBtn = document.getElementById('btn-dropbox-sync');
    const discBtn = document.getElementById('btn-dropbox-disconnect');
    if (token) {
      status.textContent = '接続済み';
      syncBtn.disabled = false;
      discBtn.disabled = false;
    } else {
      status.textContent = '未接続';
      syncBtn.disabled = true;
      discBtn.disabled = true;
    }
  }
};

// ============================================================
// 起動
// ============================================================
document.addEventListener('DOMContentLoaded', () => UI.init());
</script>
