<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mokko v5 MVP</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --line: #d1d5db;
        --text: #111827;
        --muted: #6b7280;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      .canvas-area {
        flex: 1;
        padding: 16px;
      }

      .canvas-shell {
        position: relative;
        width: 100%;
        height: calc(100vh - 32px);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
      }

      #stage-container {
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      .sidebar {
        width: 340px;
        border-left: 1px solid var(--line);
        background: var(--panel);
        padding: 20px 18px;
      }

      .sidebar h1 {
        margin: 0;
        font-size: 20px;
      }

      .sidebar p {
        margin: 8px 0 18px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 13px;
      }

      .meta {
        margin: 0 0 10px;
        font-size: 13px;
        color: var(--muted);
      }

      .parts-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .part-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: #fff;
      }

      .part-title {
        margin: 0 0 8px;
        font-weight: 600;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
      }

      .row + .row {
        margin-top: 4px;
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .badge {
        display: inline-flex;
        margin-top: 10px;
        padding: 4px 8px;
        font-size: 12px;
        border-radius: 9999px;
        color: #1e3a8a;
        background: #dbeafe;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="canvas-area">
        <div class="canvas-shell">
          <div id="stage-container"></div>
        </div>
      </section>
      <aside class="sidebar">
        <h1>mokko v5 / パーツリスト</h1>
        <p>
          キャンバス上をドラッグして家具外径を作図します。外径確定と同時に側板（18mm）を自動配置します。
        </p>
        <p class="meta">伸び寸法（初期値）: <strong>10mm</strong></p>
        <div id="parts-list" class="parts-list">
          <div class="empty">まだ部材がありません。左のキャンバスで家具外径を描画してください。</div>
        </div>
        <span class="badge">直感操作優先 MVP</span>
      </aside>
    </main>

    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
